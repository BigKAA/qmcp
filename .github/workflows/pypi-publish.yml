# Publish qmcp-qdrant to PyPI via Trusted Publishing (OIDC).
#
# Trigger: a published GitHub Release (or manual dispatch).
# Requires a one-time Trusted Publisher setup on pypi.org:
#   PyPI -> account settings -> "Publishing" (Add a new pending publisher)
#     PyPI project name: qmcp-qdrant
#     Owner:  BigKAA
#     Repository: qmcp
#     Workflow name: pypi-publish.yml
#     Environment: (leave blank)
# No API tokens or passwords are stored anywhere.

name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"

      - name: Run test suite
        run: pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pipx install hatch twine

      - name: Build sdist and wheel
        run: hatch build

      - name: Check distributions
        run: twine check dist/*

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # OIDC token for PyPI Trusted Publishing
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Tolerate re-runs and versions already uploaded manually
          skip-existing: true
